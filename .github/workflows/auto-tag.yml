name: Auto-tag après merge

on:
  push:
    branches: [master]

# Un seul calcul de version à la fois (chaque tag se base sur le précédent) ;
# on met en file plutôt que d'annuler pour ne perdre aucun merge.
concurrency:
  group: auto-tag
  cancel-in-progress: false

# Nécessaire pour pousser le tag (déclenche ensuite release.yml).
permissions:
  contents: write

jobs:
  tag:
    name: Calcule et pousse le tag de version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcule la prochaine version
        id: version
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "Dernier tag: ${LAST_TAG:-<aucun>}"

          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NEXT=$(git log "$RANGE" --format='%s%x01%b%x02' \
            | node scripts/next-version.mjs "$LAST_TAG") || {
            echo "Rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Crée et pousse le tag
        if: steps.version.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # Appel direct de release.yml : le tag ci-dessus est poussé avec le
  # GITHUB_TOKEN, qui ne redéclenche aucun workflow. On enchaîne donc la
  # release dans le même run plutôt que de compter sur l'événement push:tags.
  release:
    name: Build et publie la release Windows
    needs: tag
    if: needs.tag.outputs.skip == 'false'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
