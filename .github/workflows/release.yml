name: Release

on:
  # Appelé par auto-tag.yml juste après la création du tag : un tag poussé avec
  # le GITHUB_TOKEN par défaut ne déclenche PAS d'autre workflow (garde-fou
  # anti-récursion de GitHub), d'où l'appel direct via workflow_call.
  workflow_call:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.2.3)"
        required: true
        type: string
  # Toujours utile pour un tag poussé manuellement (git tag vX && git push).
  push:
    tags:
      - "v*"

# Nécessaire pour créer la GitHub Release et y déposer les bundles.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.msi + .exe)
    runs-on: windows-latest
    steps:
      # En workflow_call le ref par défaut est master ; on force le tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation des dépendances JS
        run: pnpm install --frozen-lockfile

      - name: Synchronise la version depuis le tag
        # set-version.mjs retire lui-même le préfixe « v » ; pas d'expansion
        # shell (cross-plateforme : le runner Windows utilise PowerShell).
        run: node scripts/set-version.mjs ${{ inputs.tag || github.ref_name }}

      - name: Build + publication de la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour (plugin updater). Secrets à définir dans
          # le dépôt ; sans eux, le build échoue car createUpdaterArtifacts=true.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "avf-compta ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
